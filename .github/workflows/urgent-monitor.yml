name: Urgent FPL monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call urgent monitor
        if: ${{ env.PRODUCTION_URL != '' && env.CRON_SECRET != '' }}
        run: |
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_URL%/}/api/notify/urgent"
      - name: Report missing configuration
        if: ${{ env.PRODUCTION_URL == '' || env.CRON_SECRET == '' }}
        run: echo "Urgent monitor skipped; configure PRODUCTION_URL and CRON_SECRET repository secrets."
